include colors.conf

font_family CommitMono Nerd Font Mono
font_size 14

active_tab_font_style bold
active_tab_title_template [{index}] {title}
allow_remote_control socket-only
listen_on unix:/tmp/kitty
background_blur 2
confirm_os_window_close 0

enable_audio_bell yes
notify_on_cmd_finish unfocused 5.0 notify-bell

hide_window_decorations yes
inactive_tab_font_style normal
linux_display_server wayland

tab_bar_min_tabs 2
tab_title_template [{index}] {title}
window_padding_width 8

# Leader key mappings (Leader: ctrl+space)
map ctrl+space>1 goto_tab 1
map ctrl+space>2 goto_tab 2
map ctrl+space>3 goto_tab 3
map ctrl+space>4 goto_tab 4
map ctrl+space>5 goto_tab 5
map ctrl+space>6 goto_tab 6
map ctrl+space>7 goto_tab 7
map ctrl+space>8 goto_tab 8
map ctrl+space>9 goto_tab 9

map ctrl+space>t new_tab_with_cwd
map ctrl+space>w close_tab
map ctrl+space>n new_os_window_with_cwd
map ctrl+space>page_down move_tab_forward
map ctrl+space>page_up move_tab_backward

# Pass-through on double-tap
map ctrl+space>ctrl+space send_text all \x00

# Shell integration shortcuts
map ctrl+space>c copy_last_command_output
map ctrl+space>f show_last_command_output
